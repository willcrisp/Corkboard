[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corkboard-api"
version = "0.1.0"
description = "Corkboard's self-hosted sync API (docs/design.md §7.3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "corkcore",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "hypothesis>=6"]

[tool.setuptools]
packages = ["corkboard_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
