[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corkboard-companion"
version = "0.1.0"
description = "Corkboard's desktop companion: syncs boards with the cloud (docs/design.md §7.1)"
requires-python = ">=3.11"
dependencies = ["corkcore"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "corkboard-api", "httpx>=0.27"]

[project.scripts]
corkboard-companion = "corkboard_companion.cli:main"

[tool.setuptools]
packages = ["corkboard_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
