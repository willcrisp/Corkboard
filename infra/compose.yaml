# Corkboard sync API, deployed as the `corkboard` Arcane project (docs/design.md §8).
# tools/arcane_deploy.py creates the project from this file and uploads the
# workspace next to it: Caddyfile, .dockerignore, api/ and shared/python/.
# So paths here are relative to the Arcane workspace root, not to infra/.
# The project's .env sets CORK_DOMAIN, the public hostname Caddy serves.
name: corkboard

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: corkboard-api:latest
    restart: unless-stopped
    environment:
      CORK_DB: /data/corkboard.db
      CORK_TRUSTED_PROXY: caddy
    volumes: [corkboard-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CORK_DOMAIN: ${CORK_DOMAIN:?set CORK_DOMAIN to the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    networks: [internal]

  backup:
    image: alpine
    restart: unless-stopped
    command: ["sh", "-c", "apk add --no-cache sqlite && while true; do sqlite3 /data/corkboard.db \".backup /data/backup-$$(date +%a).db\"; sleep 86400; done"]
    volumes: [corkboard-data:/data]

volumes:
  corkboard-data:
    name: corkboard-data
  caddy-data:
    name: corkboard-caddy-data

networks:
  internal: {}
