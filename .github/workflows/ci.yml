# Lint and test on every push and pull request (docs/next-steps.md step 6).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Lua (luacheck, busted, coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same packages the cloud sessions use (docs/next-steps.md, environment notes).
      - name: Install Lua 5.1, busted, luacheck and dkjson
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks lua-busted lua-check lua-dkjson
          # luarocks.org sometimes answers with a manifest missing luacov; fall back to its GitHub mirror.
          sudo luarocks --lua-version=5.1 install luacov \
            || sudo luarocks --lua-version=5.1 --only-server=https://raw.githubusercontent.com/rocks-moonscript-org/moonrocks-mirror/master install luacov

      - name: Lint
        run: luacheck .

      - name: Test (all specs, including the property tests)
        run: busted --output=utfTerminal

      - name: Coverage
        run: |
          busted --run=coverage
          luacov
          # §12 Phase 1: merge-core coverage of at least 95%.
          python3 .github/scripts/coverage_gate.py luacov.report.out

      - name: Spike smoke tests
        run: |
          lua5.1 spikes/mock/smoke.lua spikes/CorkSpike/CorkSpike.lua
          lua5.1 spikes/mock/smoke2.lua spikes/CorkSpike2/CorkSpike2.lua > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luacov-report
          path: luacov.report.out
          if-no-files-found: ignore

  python:
    name: Python (corkcore, API, companion)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e shared/python -e "api[test]" -e "companion[test]"

      - name: Merge core (shared vectors, Hypothesis)
        run: pytest shared/python

      - name: The fuzz corpus is up to date
        run: |
          python3 shared/test-vectors/tools/gen_sanitise_fuzz.py
          git diff --exit-code shared/test-vectors/sanitise_fuzz.json

      - name: API
        run: pytest api

      - name: Companion
        run: pytest companion

      - name: Packaging
        run: pytest tools/tests

  web:
    name: Web app (JS core, unit tests, end to end)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install -e ../shared/python -e ../api

      - name: Unit tests (shared vectors, fuzz corpus, properties, model, board store)
        run: npm test

      - name: End to end (the real API and Chromium)
        run: npm run e2e
