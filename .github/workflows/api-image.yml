# Builds the sync API image and pushes it to GHCR on an api-v* tag
# (docs/design.md §8, infra/README.md). Pull requests only build it.
name: API image

on:
  push:
    tags: ["api-v*"]
  pull_request:
    paths: ["api/**", "shared/python/**", ".github/workflows/api-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/corkboard-api"
          if [[ "$GITHUB_REF" == refs/tags/api-v* ]]; then
            version="${GITHUB_REF#refs/tags/api-v}"
            echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:pr" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test the image
        run: |
          docker build -q -f api/Dockerfile -t corkboard-api:ci .
          docker run -d --name api -p 8000:8000 corkboard-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/v1/health && exit 0; sleep 1; done
          docker logs api
          exit 1
