<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corkboard debug panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=PT+Sans+Narrow:wght@400;700&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap">
<style>
body{margin:0;background:#1c2024;font-family:'PT Sans Narrow',sans-serif;color:#e6e6e6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 800px; height: 700px; box-sizing: border-box; padding: 40px; background: #1c2024;">
<div style="width: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1b1a18; border: 3px solid #2e2b27; border-radius: 4px; box-shadow: 0 0 0 1px #000000, inset 0 0 0 1px #4d4840, 0 20px 50px rgba(0,0,0,0.7);">

<div style="position: relative; height: 26px; display: flex; align-items: center; justify-content: center; background: #0f0e0d; border-bottom: 1px solid #3a3630; font-family: 'Marcellus', Georgia, serif; font-size: 14px; color: #ffd100;">
Corkboard Debug
<button aria-label="Close" style="position: absolute; right: 3px; top: 2px; width: 22px; height: 20px; display: flex; align-items: center; justify-content: center; background: #3b100c; border: 1px solid #120403; border-radius: 3px; box-shadow: inset 0 1px 0 #6a2a20; cursor: pointer;">
<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #e0c9b0; stroke-width: 3; stroke-linecap: round;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px;">
<button style="width: 200px; height: 24px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; background: #0b0a09; border: 1px solid #4a453e; border-radius: 2px; color: #ffffff; font-size: 14px; cursor: pointer;">Molten Core prep<svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #ffd100; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="flex-grow: 1;"></span>
<button style="height: 24px; padding: 0 14px; background: linear-gradient(#6e1a12, #4a0f0a); border: 1px solid #140403; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,190,120,0.25); color: #ffd100; font-family: 'Marcellus', Georgia, serif; font-size: 13px; cursor: pointer;">Force HELLO</button>
</div>

<div style="display: flex; gap: 10px;">
<div style="width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 6px 8px; display: flex; flex-direction: column; background: #0f0e0d; border: 1px solid #34302b; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); font-size: 15px;">
<sc-for list="{{ stats }}" as="r" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; align-items: center; height: 24px; padding: 0 4px; background: {{ r.bg }};">
<span style="color: #ffd100;">{{ r.k }}</span>
<span style="color: {{ r.vc }};">{{ r.v }}</span>
</div>
</sc-for>
<div style="padding: 6px 4px 2px;"><div style="height: 8px; background: #1e1c19; border: 1px solid #000000;"><div style="width: 62%; height: 8px; background: #8a7a4a;"></div></div></div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: #0f0e0d; border: 1px solid #34302b; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);">
<div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: #ffd100;">Buckets vs Bob</span><span style="color: #9d9d9d;">3 of 32 differ · 7 ids swapped</span></div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px;">
<sc-for list="{{ buckets }}" as="k" hint-placeholder-count="32">
<div style="height: 22px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: {{ k.bg }}; border: 1px solid #000000; color: {{ k.color }};">{{ k.label }}</div>
</sc-for>
</div>
</div>
</div>

<div style="box-sizing: border-box; display: flex; flex-direction: column; background: #0f0e0d; border: 1px solid #34302b; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);">
<div style="display: flex; gap: 2px; height: 22px;">
<div style="width: 140px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; background: #26231f; border: 1px solid #000000; font-size: 14px;">Member</div>
<div style="width: 110px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; background: #26231f; border: 1px solid #000000; font-size: 14px;">Last HELLO</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; background: #26231f; border: 1px solid #000000; font-size: 14px;">Digest</div>
<div style="width: 110px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; background: #26231f; border: 1px solid #000000; font-size: 14px;">State</div>
</div>
<sc-for list="{{ peers }}" as="p" hint-placeholder-count="4">
<div style="display: flex; gap: 2px; height: 24px; align-items: center; font-size: 14px; background: {{ p.bg }};">
<div style="width: 140px; box-sizing: border-box; padding: 0 8px; color: {{ p.color }};">{{ p.name }}</div>
<div style="width: 110px; box-sizing: border-box; padding: 0 8px; color: #9d9d9d;">{{ p.hello }}</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #c8c0b0;">{{ p.digest }}</div>
<div style="width: 110px; box-sizing: border-box; padding: 0 8px; color: #9d9d9d;">{{ p.state }}</div>
</div>
</sc-for>
</div>

<div style="box-sizing: border-box; padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; background: rgba(0,0,0,0.45); border: 1px solid #34302b; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #c8c0b0;">
<sc-for list="{{ log }}" as="l" hint-placeholder-count="6">
<div style="white-space: nowrap;"><span style="color: #7a7a7a;">{{ l.t }}</span>  {{ l.line }}</div>
</sc-for>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    var diff = [3, 17, 26];
    var buckets = [];
    for (var i = 0; i < 32; i++) {
      var bad = diff.indexOf(i) !== -1;
      buckets.push({ label: (i < 10 ? '0' : '') + i, bg: bad ? '#4a3a1c' : '#1e1c19', color: bad ? '#ffd100' : '#6f6a60' });
    }
    function st(i, k, v, vc) { return { k: k, v: v, vc: vc || '#ffffff', bg: i % 2 ? 'rgba(255,255,255,0.03)' : 'transparent' }; }
    function pr(i, name, color, hello, digest, state) { return { name: name, color: color, hello: hello, digest: digest, state: state, bg: i % 2 ? 'rgba(255,255,255,0.03)' : 'transparent' }; }
    return {
      buckets: buckets,
      stats: [
        st(0, 'Send gate', 'Open'),
        st(1, 'Last closed', '4m ago (death)', '#9d9d9d'),
        st(2, 'Outbox', '0'),
        st(3, 'Throttle stalls', '2 (58s ago)'),
        st(4, 'Board clock', '1790004412'),
        st(5, 'Prefix budget', '158 / 255 B/s')
      ],
      peers: [
        pr(0, 'You', '#c69b6d', '12s', '48:1790004412:9f3a01c2', 'self'),
        pr(1, 'Bob', '#3fc7eb', '42s', '48:1790004412:9f3a01c2', 'match'),
        pr(2, 'Kaelthra', '#ffffff', '1m 12s', '48:1790004412:9f3a01c2', 'match'),
        pr(3, 'Mira', '#9d9d9d', '3h 04m', '45:1790001950:22b7e9a0', 'offline')
      ],
      log: [
        { t: '10:14:02', line: '> HELLO  channel  45 notes  136B' },
        { t: '10:14:03', line: '< IDX    Bob  buckets 03 17 26  212B' },
        { t: '10:14:03', line: '> NEED   Bob  4 ids  61B' },
        { t: '10:14:04', line: '> PUT    Bob  3 notes  0.8KB  BULK' },
        { t: '10:14:05', line: '< PUT    Bob  4 notes  1.1KB  merged 4' },
        { t: '10:14:05', line: '= digest matches Bob' }
      ]
    };
  }
}
</script>
</body>
</html>
