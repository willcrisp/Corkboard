<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corkboard note editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=PT+Sans+Narrow:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1c2024;font-family:'PT Sans Narrow',sans-serif;color:#e6e6e6}
a{text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; padding: 56px 0 0 90px; background: #1c2024;">
<div style="width: 540px; box-sizing: border-box; display: flex; flex-direction: column; background: #1b1a18; border: 3px solid #2e2b27; border-radius: 4px; box-shadow: 0 0 0 1px #000000, inset 0 0 0 1px #4d4840, 0 20px 50px rgba(0,0,0,0.7);">

<div style="position: relative; height: 26px; display: flex; align-items: center; justify-content: center; background: #0f0e0d; border-bottom: 1px solid #3a3630; font-family: 'Marcellus', Georgia, serif; font-size: 14px; color: #ffd100;">
Edit Note
<button aria-label="Close" style="position: absolute; right: 3px; top: 2px; width: 22px; height: 20px; display: flex; align-items: center; justify-content: center; background: #3b100c; border: 1px solid #120403; border-radius: 3px; box-shadow: inset 0 1px 0 #6a2a20; cursor: pointer;">
<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #e0c9b0; stroke-width: 3; stroke-linecap: round;"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 14px; color: #9d9d9d;">Molten Core prep · created by Will 2h ago · edited by Bob 14m ago</div>

<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="font-family: 'Marcellus', Georgia, serif; font-size: 13px; color: #ffd100;">Note</div>
<div style="height: 150px; box-sizing: border-box; padding: 8px 10px; background: #0b0a09; border: 1px solid #4a453e; border-radius: 2px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); font-size: 16px; line-height: 1.4; color: #ffffff;">Need 4x <a href="#" style="color: #a335ee;">[Fiery Core]</a> and 2x <a href="#" style="color: #a335ee;">[Lava Core]</a> for the fire-res cloak. Anyone with spares, mail Will. Also farming <a href="#" style="color: #ffffff;">[Elemental Fire]</a><span style="display: inline-block; width: 1px; height: 17px; margin-left: 1px; vertical-align: -3px; background: #ffffff;"></span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #9d9d9d;">
<span>Shift-click items, quests or spells to link them</span>
<span>214 / 2000</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px;">
<div style="font-family: 'Marcellus', Georgia, serif; font-size: 13px; color: #ffd100;">Tag</div>
<div style="display: flex; gap: 6px;">
<sc-for list="{{ swatches }}" as="s" hint-placeholder-count="6">
<button aria-label="{{ s.aria }}" aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="width: 20px; height: 20px; box-sizing: border-box; padding: 0; border: 1px solid #000000; cursor: pointer; background: {{ s.fill }}; box-shadow: {{ s.ring }};"></button>
</sc-for>
</div>
<span style="font-size: 13px; color: #9d9d9d;">{{ pickedLabel }}</span>
</div>

<div style="display: flex; align-items: center; gap: 6px; padding-top: 4px;">
<button style="height: 24px; padding: 0 14px; background: linear-gradient(#6e1a12, #4a0f0a); border: 1px solid #140403; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,190,120,0.25); color: #ffd100; font-family: 'Marcellus', Georgia, serif; font-size: 13px; cursor: pointer;">Delete</button>
<div style="flex-grow: 1;"></div>
<button style="height: 24px; padding: 0 14px; background: linear-gradient(#6e1a12, #4a0f0a); border: 1px solid #140403; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,190,120,0.25); color: #ffd100; font-family: 'Marcellus', Georgia, serif; font-size: 13px; cursor: pointer;">Cancel</button>
<button style="height: 24px; padding: 0 18px; background: linear-gradient(#6e1a12, #4a0f0a); border: 1px solid #140403; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,190,120,0.25); color: #ffd100; font-family: 'Marcellus', Georgia, serif; font-size: 13px; cursor: pointer;">Save</button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picked = (this.state && this.state.picked) || 'amber';
    var tags = [
      { id: 'none', label: 'No tag', fill: '#1b1a18' },
      { id: 'amber', label: 'Amber', fill: '#9a7a3c' },
      { id: 'blue', label: 'Blue', fill: '#4f6f92' },
      { id: 'green', label: 'Green', fill: '#5d7d4c' },
      { id: 'rose', label: 'Rose', fill: '#8f5563' },
      { id: 'violet', label: 'Violet', fill: '#6d5c8f' }
    ];
    var label = 'Amber';
    var swatches = tags.map(function (t) {
      var on = t.id === picked;
      if (on) { label = t.label; }
      return {
        fill: t.fill,
        aria: t.label,
        pressed: on ? 'true' : 'false',
        ring: on ? '0 0 0 1px #000000, 0 0 0 2px #ffd100' : 'inset 0 0 0 1px rgba(255,255,255,0.12)',
        pick: function () { self.setState({ picked: t.id }); }
      };
    });
    return { swatches: swatches, pickedLabel: label };
  }
}
</script>
</body>
</html>
